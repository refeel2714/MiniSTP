[project]
name = "ministp"
version = "0.1.0"
description = "Mini brokerage back office for Korean equities: order-to-reconciliation STP with an append-only ledger."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ministp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gate: Phase gate test derived from docs/spec/04-sample-trades.md",
    "db: needs PostgreSQL via MINISTP_TEST_DATABASE_URL",
]
