# MiniSTP 계정 → 회사 ERP 계정 매핑 예시 (spec D9, R-96)
#
# 매핑 파일은 선택이에요. 없으면 MiniSTP 계정코드와 이름 그대로 내보내요.
# 계정코드는 설명용으로 지어낸 예시예요. 회사 계정과목표에 맞게 고쳐서
# 저장소 밖이나 erp-mapping.yaml(커밋되지 않음)로 저장해 쓰세요.
# MiniSTP 계정 여러 개를 ERP 계정 하나로 모아도 돼요(예: 평가이익과 매매이익을 한 계정으로).
# 내보낼 기간에 쓰인 MiniSTP 계정이 하나라도 빠져 있으면 파일을 만들지 않아요.

company: "1000"          # 회사코드
document_type: "SA"      # 전표유형 (일반전표)
currency: KRW

accounts:
  "1010": {code: "1110300", name: "증권사예치금"}            # 예수금
  "1020": {code: "1120500", name: "미수금-증권매도"}          # 매도미수금
  "1030": {code: "1120600", name: "미수수익-배당"}            # 미수배당금
  "1100": {code: "1130100", name: "당기손익-공정가치측정금융자산"}  # FVPL 주식
  "1110": {code: "1130110", name: "FVPL금융자산평가조정"}      # FVPL 주식 평가조정
  "2010": {code: "2110500", name: "미지급금-증권매수"}         # 매수미지급금
  "3010": {code: "1110100", name: "보통예금"}                # 투자원금: 법인 장부에서는 은행 → 증권계좌 자금 이체
  "4010": {code: "8110100", name: "FVPL금융자산처분이익"}      # 매매이익
  "4020": {code: "8110200", name: "FVPL금융자산평가이익"}      # 평가이익
  "4030": {code: "8110300", name: "배당금수익"}               # 배당수익
  "4040": {code: "8110400", name: "이자수익"}                # 이자수익 (수동 조정, R-66)
  "4090": {code: "8190100", name: "잡이익"}                  # 잡이익 (수동 조정)
  "5010": {code: "8210100", name: "FVPL금융자산처분손실"}      # 매매손실
  "5020": {code: "8210200", name: "FVPL금융자산평가손실"}      # 평가손실
  "5030": {code: "8210300", name: "지급수수료-증권"}           # 지급수수료
  "5040": {code: "8210400", name: "세금과공과-증권거래세"}      # 세금과공과
  "5090": {code: "8290100", name: "잡손실"}                  # 잡손실 (수동 조정)
  "5050": {code: "1140100", name: "선납세금"}                # 법인세등(원천징수): 법인은 결산 때 법인세에서 공제
