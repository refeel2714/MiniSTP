id: STP-3100
title: 원장 조회
layout: split
left: 40
purpose: 왼쪽에서 원장 이벤트 하나를 고르면 그 이벤트가 바꾼 보유수량과 예수금을 오른쪽에 보여줘요. 원장에 무엇이 어떤 순서로 기록됐는지 따라가는 화면이에요. 이벤트를 두 번 누르면 그 이벤트가 만든 분개를 분개 조회(STP-3200)에서 열어요.
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
  - {name: event_type, type: select, source: ledger_events.event_type,
     options: [DepositEvent, OpeningPositionEvent, ExecutionEvent, SettlementEvent, RevaluationEvent, NavEvent, LateExecutionEvent, DayClosedEvent, DividendAccrualEvent, DividendPaymentEvent, DividendCancelEvent, WithdrawalEvent, TransferOutEvent, TransferInEvent, AdjustmentEvent, AdjustmentCancelEvent]}
  - {name: symbol, type: text, source: instruments.symbol, lookup: symbol}
  - {name: seq, type: number, source: ledger_events.seq}
grids:
  - id: events
    title: 원장 이벤트
    live: true
    tx: STP3100R01
    load: open
    drill: {screen: STP-3200, params: {seq: seq}}
    columns:
      - {name: seq, source: ledger_events.seq, format: number}
      - {name: event_type, source: ledger_events.event_type, format: code}
      - {name: date, label: 영업일, format: date}
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: recorded_at, source: ledger_events.recorded_at, format: datetime}
      - {name: payload, source: ledger_events.payload, format: json}
  - id: positions
    title: 보유수량 변동
    tx: STP3100R02
    dataset: positions
    load: master
    master: events
    link: {seq: seq}
    columns:
      - {name: trade_date, source: position_ledger.trade_date, format: date}
      - {name: symbol, source: position_ledger.symbol, format: code}
      - {name: exec_id, source: position_ledger.exec_id, format: code}
      - {name: qty_delta, source: position_ledger.qty_delta, format: number, color: sign}
      - {name: cost_delta, source: position_ledger.cost_delta, format: money, color: sign}
      - {name: realized_pnl, source: position_ledger.realized_pnl, format: money, color: sign}
  - id: cash
    title: 예수금 변동
    tx: STP3100R02
    dataset: cash
    load: master
    master: events
    link: {seq: seq}
    columns:
      - {name: date, source: cash_ledger.date, format: date}
      - {name: reason, source: cash_ledger.reason, format: code}
      - {name: amount, source: cash_ledger.amount, format: money, color: sign}
      - {name: ref_id, source: cash_ledger.ref_id, format: code}
