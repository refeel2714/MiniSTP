id: STP-2400
title: 마감 점검
purpose: 하루 작업이 어디까지 끝났고 무엇이 남았는지를 한곳에서 봐요. 왼쪽에서 영업일을 고르면 오른쪽에 그날의 작업이 하는 순서대로(결제, 주문·체결, 시세, 기준가, 증권사 대사, 일 마감, 원장 내부 대사) 한 줄씩 나오고, 줄마다 상태와 그렇게 본 까닭이 적혀 있어요. 완료와 대상 없음은 끝난 단계, 대기는 오늘 아직 하지 않은 단계, 주의는 끝났지만 한번 볼 단계, 확인 필요는 누가 판단해야 하는 단계, 누락은 날이 지났는데 하지 않은 단계예요. 줄을 두 번 누르면 그 단계의 상세 화면이 그날로 열려요. 원장 내부 대사는 그날이 아니라 지금 원장의 상태예요. 모든 단계는 위쪽에서 고른 계좌의 것이에요.
layout: split
left: 32
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
grids:
  - id: days
    title: 영업일
    live: true
    key: date
    tx: STP2400R01
    load: open
    meta: {attention_days: 확인이 필요한 날}
    columns:
      - {name: date, label: 영업일, format: date}
      - {name: done, label: 끝난 단계, format: number, display: meter, of: steps}
      - {name: steps, label: 전체 단계, format: number, hidden: true}
      - {name: attention, label: 확인 필요, format: number, hidden: true}
      - {name: state, label: 상태, color: status, display: pill}
  - id: steps
    title: 하루 작업 단계
    tx: STP2400R02
    load: master
    master: days
    link: {date: date}
    drill:
      by: screen
      screens: [STP-4200, STP-1200, STP-2300, STP-2210, STP-2100, STP-2200, STP-2110]
      params: {day: date, date_from: date, date_to: date}
    columns:
      - {name: "no", label: 순서, format: number, hidden: true}
      - {name: step, label: 단계}
      - {name: state, label: 상태, color: status, display: pill}
      - {name: detail, label: 내용}
      - {name: screen, label: 상세 화면, format: code}
      - {name: date, label: 영업일, format: date, hidden: true}
