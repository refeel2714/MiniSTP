    title: 종목
    live: true
    key: symbol
    tx: STP2300R01
    load: open
    meta: {warn_change: 주의(전일 대비), limit_change: 확인 필요(가격제한폭), warn_exec_gap: 주의(체결단가와 종가)}
    columns:
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: last_close, label: 마지막 종가, format: money}
      - {name: change, label: 기간 등락(%), format: rate, color: sign}
      - {name: trend, label: 추세, format: series, display: spark}
      - {name: level, label: 점검, color: status, display: pill}
      - {name: days, label: 종가 수, format: number, hidden: true}
      - {name: base_close, label: 기준 종가, format: money, hidden: true}
      - {name: last_date, label: 마지막 종가의 날짜, format: date, hidden: true}
      - {name: high, label: 기간 최고, format: money, hidden: true}
      - {name: low, label: 기간 최저, format: money, hidden: true}
      - {name: date_from, label: 시작일, format: date, hidden: true}
      - {name: date_to, label: 종료일, format: date, hidden: true}
  - id: closes
    title: 기간별 종가
    tx: STP2300R02
