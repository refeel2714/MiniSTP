id: STP-2300
title: 시세 추이
purpose: 장부가 평가와 기준가에 쓴 종가가 기간 동안 어떻게 움직였는지 봐요. 왼쪽은 그 기간에 종가를 받은 종목마다 마지막 종가, 기간 등락, 추세예요. 종목을 고르면 오른쪽에 그 종목의 날짜별 종가가 그래프와 표로 나오고, 날마다 전일 대비와 그날 체결단가와의 차이를 보여줘요. 기간을 비워 두면 원장을 시작한 날부터 전부예요. 점검 열은 종가가 장부에 쓸 수 있는 값인지만 봐요(호가단위에 맞는지, 평가와 기준가가 같은 종가를 썼는지, 가격제한폭 안인지). 왼쪽 목록은 점검 결과가 나쁜 종목부터 나와요. 가격이 왜 움직였는지는 이 화면이 판단하지 않아요. 종가를 원장이 받은 날에만 값이 있어요(보유 종목, 하루 한 번).
layout: split
left: 46
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
grids:
