id: STP-2300
title: 시세 점검
purpose: 평가와 기준가에 쓴 종가가 믿을 만한지 봐요. 대사는 수량과 금액을 맞추지만 종가가 틀리면 대사는 맞는데 기준가가 틀려요. 왼쪽에서 기준일을 고르면 오른쪽에 그날 쓴 종가를 종목마다 전일 종가, 그날의 체결단가와 견준 결과가 나와요. 종가가 호가단위에 맞는지, 평가에 쓴 종가와 기준가에 쓴 종가가 같은지, 전일 대비 가격제한폭을 넘게 움직이지 않았는지를 확인하고, 확인이 필요한 날이 있으면 그날이 먼저 골라져 있어요. 오늘 종가가 아직 없으면 평가 전으로 맨 위에 보여요. 기준은 목록 위에 적혀 있어요.
layout: split
left: 34
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
grids:
  - id: days
    title: 기준일
    live: true
    key: date
    tx: STP2300R01
    load: open
    meta: {warn_change: 주의(전일 대비), limit_change: 확인 필요(가격제한폭), warn_exec_gap: 주의(체결단가와 종가)}
    columns:
      - {name: date, label: 기준일, format: date}
      - {name: symbols, label: 종목 수, format: number}
      - {name: flagged, label: 확인 필요, format: number}
      - {name: warned, label: 주의, format: number}
      - {name: result, label: 결과, color: status, display: pill}
  - id: prices
    title: 종목별 종가
    tx: STP2300R02
    load: master
    master: days
    link: {date: date}
    drill: {screen: STP-3100, params: {symbol: symbol}}
    columns:
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: close, label: 종가, format: money}
      - {name: prev_close, label: 전일 종가, format: money}
      - {name: prev_date, label: 전일 종가의 날짜, format: date}
      - {name: change, label: 전일 대비(%), format: rate, color: sign}
      - {name: exec_gap, label: 체결단가 − 종가(%), format: rate, color: sign}
      - {name: level, label: 결과, color: status, display: pill}
      - {name: reasons, label: 사유}
