id: STP-1100
title: 실시간 잔고
purpose: 장중 보유·예수금·주문가능금액(IBOR)을 한 화면에서 확인해요. 보유는 `run`이 1분마다 받은 현재가로 평가하고, `run`이 꺼져 있으면 원장이 아는 가장 최근 종가로 평가해요(R-68). 어떤 가격인지는 목록 위 "평가 기준"과 가격 칸 아래 시각에 적혀요. 가운데 줄은 주식·ETF 같은 자산 유형별 평가금액과 비중이에요. 종목별 비중은 목록의 비중 막대로 봐요. 주문가능금액은 주문 검증과 같은 계산(R-37)이에요.
grids:
  - id: cash
    title: 예수금과 주문가능금액
    live: true
    tx: STP1100R02
    load: open
    view: cards
    columns:
      - {name: cash_d0, label: 예수금 D+0, format: money}
      - {name: projected_cash, label: 결제 후 예수금, format: money}
      - {name: pending_buy_value, label: 미체결 매수 예약, format: money}
      - {name: available_cash, label: 주문가능금액, format: money}
      - {name: unpriced_buy_orders, label: 가격 미정 시장가 매수, format: number}
  - id: mix
    title: 자산 유형별
    live: true
    tx: STP1100R01
    dataset: mix
    load: open
    columns:
      - {name: asset_type_name, label: 자산 유형}
      - {name: count, label: 종목 수, format: number}
      - {name: market_value, label: 평가금액, format: money}
      - {name: weight, label: 비중(평가금액), format: rate, display: meter}
      - {name: unrealized_pnl, label: 평가손익, format: money, color: sign}
  - id: holdings
    title: 종목별 보유
    live: true
    tx: STP1100R01
    load: open
    meta: {basis: 평가 기준}
    totals: [market_value, unrealized_pnl, book_cost]
    drill: {screen: STP-3100, params: {symbol: symbol}}
    columns:
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: qty, source: positions_v.qty, format: number}
      - {name: price, label: 현재가, format: money, sub: price_at}
      - {name: price_at, label: 가격 시각, format: text}
      - {name: market_value, label: 평가금액, format: money}
      - {name: unrealized_pnl, label: 평가손익, format: money, color: sign, sub: pnl_rate}
      - {name: pnl_rate, label: 평가손익률, format: text}
      - {name: book_cost, source: positions_v.book_cost, format: money}
      - {name: weight, label: 비중(평가금액), format: rate, display: meter}
      - {name: today_qty, label: 오늘 체결 수량, format: number, color: sign}
