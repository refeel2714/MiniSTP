id: STP-1500
title: 바스켓 주문 시뮬레이션
purpose: 이번 주문의 배분 비율과 총 주문금액을 넣으면 종목별 수량을 계산해요(R-97). 배분 비율은 총 주문금액을 종목에 나누는 비율(합계 100%)이에요. 계좌 전체의 목표 편입비가 아니에요. 한 번 주문하는 금액이 계좌 평가금액보다 훨씬 작으면 한 번에 목표 편입비를 맞출 수 없어서, 주문 결과로 비중이 어떻게 되는지는 "주문 후 비중"으로 봐요. 처음에는 지금 보유 종목이 현재 편입비(보유 평가금액 비중, 예수금 제외) 비율 그대로 들어가 있고(그대로 사면 비중 유지), 배분 비율을 고치면 오른쪽이 바로 다시 계산돼요. 수량은 배분 금액 ÷ 주문가를 1주 단위로 내리고, 주문가는 현재가를 호가단위에 맞춘 값이에요. 검사는 묶음 검증(R-98)이 해요. 주문 전 검증과 같은 기준(R-36~38)으로 앞 줄을 보냈다고 친 채 다음 줄을 보고, 종목당 비중 한도는 매수에만(미체결 매수 포함) 걸어요. 계산만 하고 DB에 쓰지 않으며 주문도 내지 않아요. 주문안 오른쪽 위 "주문 줄로 보내기"를 누르면 수량이 있는 줄이 STP-1210 주식 주문에 바스켓 묶음(BK)으로 들어가고, 거기서 함께 결재 요청하면 요청 1건(주문 유형 바스켓)이 돼요(R-99~102). 같은 계산을 `basket simulate` 명령으로 CSV로 저장할 수 있어요.
layout: split
left: 36
conditions:
  - {name: amount, type: number, label: 총 주문금액, required: true, default: "10000000"}
  - {name: side, type: select, source: oms_orders.side, options: [BUY, SELL], default: BUY, required: true}
  - {name: basis, type: select, label: 주문가, options: [현재가 지정가, 현재가 +1호가, 시장가], default: 현재가 지정가, required: true}
  - {name: limit, type: number, label: 종목당 한도(%), default: "30"}
grids:
  - id: basket
    title: 바스켓
    tx: STP1500R01
    load: open
    key: symbol
    meta: {basis: 현재 편입비 기준}
    totals: [current_weight, target_weight]
    edit: {column: target_weight, base: current_weight, param: basket, reset: ↺ 현재 편입비로, add: symbol}
    columns:
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: current_weight, label: 현재 편입비(%), format: rate}
      - {name: target_weight, label: 배분 비율(%), format: rate}
      - {name: price, label: 현재가, format: money}
  - id: plan
    title: 종목별 주문안
    tx: STP1500R02
    load: input
    key: symbol
    weight: 3
    meta: {basis: 계산 기준, limit: 종목당 한도}
    totals: [target_amount, amount, actual_weight, costs]
    columns:
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: order_price, label: 주문가, format: money, sub: tick_text}
      - {name: tick_text, label: 호가단위}
      - {name: target_amount, label: 배분 금액, format: money}
      - {name: qty, label: 수량, format: number}
      - {name: amount, label: 주문금액, format: money}
      - {name: actual_weight, label: 실제 배분 비율(%), format: rate, sub: weight_gap}
      - {name: weight_gap, label: 배분 차이(%p), format: rate}
      - {name: costs, label: 예상 비용, format: money}
      - {name: post_weight, label: 주문 후 비중(%), format: rate}
      - {name: check_text, label: 검사, display: pill, color: verdict}
      - {name: line, label: 주문 줄, hidden: true}
    handoff: {label: 주문 줄로 보내기, screen: STP-1210, column: line, param: lines}
  - id: summary
    title: 요약
    tx: STP1500R02
    dataset: summary
    load: input
    view: cards
    meta: {ok: 결재 가능}
    columns:
      - {name: verdict, label: 판단, color: verdict}
      - {name: total_amount, label: 총 주문금액, format: money}
      - {name: allocated, label: 배정 금액, format: money}
      - {name: leftover, label: 남는 금액, format: money}
      - {name: costs, label: 예상 비용, format: money}
      - {name: required_cash, label: 필요 금액(여유분 포함), format: money}
      - {name: available_cash, label: 주문가능금액, format: money}
