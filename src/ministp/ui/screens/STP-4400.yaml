id: STP-4400
title: 계좌 관리
layout: split
left: 45
purpose: 왼쪽에서 위탁계좌를 고르면 오른쪽에 그 계좌의 보유와 상태 이력이 나와요. 화면을 열면 위쪽 막대에서 고른 계좌가 먼저 골라져 있고, 더블클릭하면 그 계좌의 계좌정보(STP-4200)로 가요. 계좌번호와 인증키는 DB에 없고 이 화면에도 나오지 않아요. 계좌 등록과 상태 변경은 위탁계좌 그리드 오른쪽 위 버튼으로 해요 (CLI의 account 명령과 같은 처리). 고객 등록은 고객별 보유(STP-4500)에서 해요.
grids:
  - id: accounts
    title: 위탁계좌
    live: true
    tx: STP4400R01
    load: open
    key: account_id
    totals: [cash_d0, book_cost]
    drill: {screen: STP-4200, account: account_id}
    columns:
      - {name: account_id, source: trading_accounts.account_id, format: code}
      - {name: alias, source: trading_accounts.alias}
      - {name: customer_alias, source: customers.alias}
      - {name: status, source: account_status_v.status, format: code, color: status}
      - {name: cash_d0, label: 예수금 D+0, format: money}
      - {name: book_cost, label: 보유 장부금액, format: money}
    actions:
      - id: add
        label: 계좌 등록
        tx: STP4400U01
        reload: true
        note: 계좌번호와 인증키는 넣지 않아요. 인증정보 이름만 적고, 키는 이 PC의 환경변수(MINISTP_<이름>_APP_KEY 등)에 둬요. 지금은 모의투자 계좌만 등록해요.
        fields:
          - {name: account_id, source: trading_accounts.account_id}
          - {name: customer_id, source: trading_accounts.customer_id, lookup: customer}
          - {name: alias, source: trading_accounts.alias}
          - {name: credential_ref, source: trading_accounts.credential_ref}
      - id: status
        label: 상태 변경
        tx: STP4400U02
        needs_row: true
        reload: true
        shows: [account_id, alias, status]
        note: 상태는 고치지 않고 이력에 새 행으로 덧붙여요. 해지는 예수금·보유·미결제가 모두 0일 때만 되고, 해지한 계좌는 다시 열지 않아요.
        fields:
          - {name: account_id, source: trading_accounts.account_id, column: account_id, readonly: true}
          - {name: status, source: account_status_history.status, lookup: code, lookup_params: {group_id: ACCOUNT_STATUS}}
          - {name: effective_from, source: account_status_history.effective_from, type: date, default: today}
          - {name: reason, source: account_status_history.reason}
  - id: positions
    title: 이 계좌의 보유
    tx: STP4400R03
    load: master
    master: accounts
    link: {account_id: account_id}
    weight: 2
    totals: [book_cost]
    columns:
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: symbol, source: positions_v.symbol, format: code}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: qty, source: positions_v.qty, format: number}
      - {name: book_cost, source: positions_v.book_cost, format: money}
  - id: status_history
    title: 이 계좌의 상태 이력
    tx: STP4400R02
    load: master
    master: accounts
    link: {account_id: account_id}
    columns:
      - {name: status, source: account_status_history.status, format: code, color: status}
      - {name: effective_from, source: account_status_history.effective_from, format: date}
      - {name: reason, source: account_status_history.reason}
