id: STP-3200
title: 분개 조회
layout: split
left: 42
purpose: 왼쪽에서 이벤트 하나를 고르면 그 이벤트가 만든 분개 전체를 오른쪽에 ERP 전표처럼 차변(계정·과목·금액)과 대변(계정·과목·금액)을 나란히 보여줘요. T계정이나 표로도 바꿔 볼 수 있어요. 전표 번호·회계일·전표 유형·원천은 전표마다 맨 왼쪽 칸에 따로 적고, 전표 사이는 점선으로 나누고, 차변 합계와 대변 합계가 맞는지를 합계 줄에 보여줘요. 이벤트를 두 번 누르면 그 이벤트의 보유·예수금 변동을 원장 조회(STP-3100)에서 열어요.
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
  - {name: event_type, type: select, source: ledger_events.event_type,
     options: [DepositEvent, OpeningPositionEvent, ExecutionEvent, SettlementEvent, RevaluationEvent, LateExecutionEvent, DividendAccrualEvent, DividendPaymentEvent, DividendCancelEvent, WithdrawalEvent, TransferOutEvent, TransferInEvent]}
  - {name: symbol, type: text, source: instruments.symbol, lookup: symbol}
  - {name: seq, type: number, source: ledger_events.seq}
grids:
  - id: events
    title: 분개를 만든 이벤트
    live: true
    tx: STP3200R01
    load: open
    drill: {screen: STP-3100, params: {seq: seq}}
    columns:
      - {name: seq, source: ledger_events.seq, format: number}
      - {name: event_type, source: ledger_events.event_type, format: code}
      - {name: date, label: 영업일, format: date}
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: entries, label: 전표 수, format: number}
      - {name: lines, label: 줄 수, format: number}
      - {name: amount, label: 차변 합계, format: money}
  - id: journal
    title: 분개
    tx: STP3200R02
    dataset: journal
    load: master
    view: taccount
    taccount: {entry: entry_id, account: account_code, name: account_name, debit: debit, credit: credit}
    master: events
    link: {seq: seq}
    totals: [debit, credit]
    meta: {balanced: 차대 일치}
    columns:
      - {name: entry_id, source: journal_entries.entry_id, format: number}
      - {name: date, source: journal_entries.date, format: date}
      - {name: kind_name, label: 전표 유형}
      - {name: source_id, source: journal_entries.source_id, format: code}
      - {name: account_code, source: journal_lines.account_code, format: code}
      - {name: account_name, source: accounts_chart.name}
      - {name: debit, source: journal_lines.debit, format: money}
      - {name: credit, source: journal_lines.credit, format: money}
      - {name: reverses_entry_id, source: journal_entries.reverses_entry_id, format: number}
