id: STP-3400
title: 계좌정보
purpose: 원장 기준 계좌 요약과 결제일별 예수금(D+n), 결제 예정 체결을 보여줘요. 계좌번호와 인증키는 DB에 없고 이 화면에도 나오지 않아요(사용자 PC 환경에만 있어요). 증권사 잔고와의 일치 여부는 마지막 대사 결과로 보여줘요.
grids:
  - id: account
    title: 계좌 요약 (원장 기준)
    live: true
    tx: STP3400R01
    load: open
    view: cards
    columns:
      - {name: account_id, source: trading_accounts.account_id, format: code}
      - {name: alias, source: trading_accounts.alias}
      - {name: status, source: account_status_v.status, format: code, codes: ACCOUNT_STATUS, color: status}
      - {name: cash_d0, label: 예수금 D+0, format: money}
      - {name: projected_cash, label: 결제 후 예수금, format: money}
      - {name: receivables, label: 받을 결제대금, format: money}
      - {name: payables, label: 낼 결제대금, format: money}
      - {name: unsettled, label: 미결제 체결, format: number}
      - {name: holdings, label: 보유 종목 수, format: number}
      - {name: market_value, label: 평가금액(최근 종가), format: money}
      - {name: valued_on, label: 평가 기준일, format: date}
      - {name: opened, label: 원장 개시일, format: date}
      - {name: last_recon_date, label: 마지막 대사일, format: date}
      - {name: last_recon_at, label: 마지막 대사 시각, format: datetime}
      - {name: open_breaks, label: 마지막 대사 불일치, format: number}
      - {name: clean_streak, label: 무오류 연속 영업일, format: number}
  - id: ladder
    title: 결제일별 예수금 (D+n)
    live: true
    tx: STP3400R02
    load: open
    key: date
    columns:
      - {name: day_label, label: 구분, format: code}
      - {name: date, label: 일자, format: date}
      - {name: cash_in, label: 들어올 돈, format: money}
      - {name: cash_out, label: 나갈 돈, format: money}
      - {name: cash_after, label: 그날 예수금, format: money}
  - id: settlements
    title: 결제 예정 체결
    live: true
    tx: STP3400R03
    load: open
    totals: [amount]
    columns:
      - {name: exec_id, label: 체결ID, format: code}
      - {name: trade_date, label: 체결일, format: date}
      - {name: settle_date, label: 결제일, format: date}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: symbol, source: instruments.symbol, format: code}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: side, source: oms_orders.side, format: code, color: side, display: pill}
      - {name: qty, label: 수량, format: number}
      - {name: amount, label: 결제금액(+받음/−냄), format: money, color: sign}
