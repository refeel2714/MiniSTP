id: STP-4600
title: 코드 조회
layout: split
left: 48
purpose: 시스템에 코드로 들어 있는 값과 그 이름을 한곳에서 봐요. 왼쪽에서 코드 그룹을 고르면 오른쪽에 그 그룹의 코드와 코드명이 나와요. 계정과목은 원장 분개가 직접 참조하는 코드라서 전용 테이블에 있고, 나머지는 공통코드예요. 공통코드가 스키마 제약, 프로그램, 저장된 값과 어긋나면 "스키마·프로그램과 일치"가 아니오로 바뀌어요. 코드명 변경은 CLI(code rename)로만 해요.
grids:
  - id: groups
    title: 코드 그룹
    live: true
    tx: STP4600R01
    load: open
    key: group_id
    meta: {consistent: 스키마·프로그램과 일치}
    columns:
      - {name: group_id, source: code_groups.group_id, format: code}
      - {name: name, source: code_groups.name}
      - {name: store, label: 관리 위치}
      - {name: codes, label: 코드 수, format: number}
      - {name: used_by, source: code_groups.used_by, format: code}
  - id: codes
    title: 이 그룹의 코드
    tx: STP4600R02
    load: master
    master: groups
    link: {group_id: group_id}
    columns:
      - {name: code, source: common_codes.code, format: code}
      - {name: name, source: common_codes.name}
      - {name: description, source: common_codes.description}
      - {name: in_use, source: common_codes.in_use}
