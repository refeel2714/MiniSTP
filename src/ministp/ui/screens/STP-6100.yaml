id: STP-6100
title: 수익률
purpose: 기준가로 잰 수익률이에요. 입금과 출금은 그 전 기준가로 좌수를 늘리거나 줄이기 때문에 순자산은 움직여도 기준가는 움직이지 않아요. 그래서 기준가의 변화가 곧 투자한 돈의 수익률(시간가중수익률)이에요. 위쪽에 설정 이후, 연초 이후, 최근 1개월 수익률이 마지막 기준일까지로 나오고, 왼쪽은 월별 수익률(그 달 마지막 기준가를 전월 말 기준가와 비교), 누적, 그 달의 손익(순자산 변화에서 입출금을 뺀 원화 금액)이에요. 월을 고르면 오른쪽에 그 달의 기준가 그래프와 날짜별 수익률이 나와요. 기간을 넣으면 그 기간의 날만 세고, 누적이 기간 직전 기준가부터라서 맨 위 달의 누적이 곧 기간 수익률이에요. 벤치마크(지수) 비교는 지수 시세를 저장하게 되면 붙여요.
layout: split
left: 54
conditions:
  - {name: date_from, type: date, label: 시작일}
  - {name: date_to, type: date, label: 종료일}
