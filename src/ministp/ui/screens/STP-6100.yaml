      - {name: profit, label: 손익, format: money, color: sign}
      - {name: trend, label: 기준가 추이, format: series, display: spark}
      - {name: flows, label: 입출금, format: money, hidden: true}
      - {name: end_nav, label: 월말 기준가, format: rate, hidden: true}
