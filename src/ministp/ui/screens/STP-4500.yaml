id: STP-4500
title: 분개 모형
purpose: 원장이 이벤트 유형마다 어떤 전표를 만드는지 보여줘요. 왼쪽에서 모형을 고르면 오른쪽에 그 전표의 줄(차변·대변, 계정, 금액 산식, 업무 규칙)과 참고 한 줄이 나와요. 화면에 따로 저장한 표가 아니라 원장 코드의 규칙을 옮긴 표이고, 무작위로 만든 장부의 전표가 모두 이 표의 모형 하나에 들어맞는지 시험이 매번 확인해요. 모형을 두 번 누르면 그 이벤트 유형의 실제 분개를 분개 조회(STP-3200)에서 열어요. 모형을 DB 테이블로 옮겨 원장이 읽게 하는 것은 게이트 뒤예요.
layout: split
left: 50
grids:
  - id: templates
    title: 분개 모형
    tx: STP4500R01
    load: open
    key: code
    drill: {screen: STP-3200, params: {event_type: event_type}}
    columns:
      - {name: code, label: 모형, format: code}
      - {name: event_type, source: ledger_events.event_type, format: code}
      - {name: kind, source: journal_entries.kind, hidden: true}
      - {name: kind_name, label: 전표 유형}
      - {name: case, label: 조건}
      - {name: shape, label: 전표 모양, hidden: true}
      - {name: line_count, label: 줄 수, format: number}
      - {name: note, label: 참고, hidden: true}
  - id: lines
    title: 모형의 줄
    tx: STP4500R02
    load: master
    master: templates
    link: {code: code}
    meta: {case: 조건, note: 참고}
    columns:
      - {name: side_name, label: 차대}
      - {name: account_code, source: accounts_chart.code, format: code}
      - {name: account_name, source: accounts_chart.name}
      - {name: amount, label: 금액 산식}
      - {name: rule, label: 업무 규칙, format: code}
