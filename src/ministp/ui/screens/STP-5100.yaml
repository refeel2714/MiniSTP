id: STP-5100
title: 주문 결재
purpose: 승인을 기다리는 요청을 체크해서 한 번에 승인하거나 반려해요(R-100, R-102). 오른쪽 "선택 묶음 검증"은 체크한 요청을 모두 함께, 이미 승인했지만 아직 안 나간 요청과 미체결 주문까지 더해서 다시 본 결과예요(R-98). 묶음이 불합격이거나 내 1건 승인 한도를 넘거나, 본인이 쓴 요청인데 셀프 승인 허용이 없으면 승인 버튼이 잠겨요. 바스켓(BK)처럼 묶음 번호가 같은 요청은 함께 체크되고 함께 승인·반려돼요. 승인해도 장중 `run`이 보내기 직전에 같은 계산을 한 번 더 해요. 요청 취소는 작성자만 해요.
layout: split
left: 66
conditions:
  - {name: status, type: select, source: order_requests_v.status, options: [PENDING, APPROVED, REJECTED, CANCELED, SENT, SEND_FAILED, EXPIRED], default: PENDING}
  - {name: trade_date, type: date, source: order_requests.trade_date}
grids:
  - id: requests
    title: 결재할 요청
    tx: STP5100R01
    load: input
    key: request_id
    weight: 3
    live: true
    meta: {user: 사용자}
    pick: {param: picked, when: pickable, group: batch_id}
    columns:
      - {name: request_id, source: order_requests.request_id, format: code, sub: batch_id}
      - {name: pickable, label: 체크 가능, hidden: true}
      - {name: batch_id, source: order_requests.batch_id, format: code, hidden: true}
      - {name: symbol, source: order_requests.symbol, format: code}
      - {name: instrument_name, source: instruments.name, display: badge, code: symbol, shape: asset_type}
      - {name: asset_type, source: instruments.asset_type, format: code}
      - {name: side, source: order_requests.side, format: code, color: side, sub: kind, codes: ORDER_SIDE}
      - {name: kind, label: 주문 유형}
      - {name: qty, source: order_requests.qty, format: number, sub: limit_price}
      - {name: limit_price, source: order_requests.limit_price, format: money}
      - {name: amount, label: 주문금액, format: money}
      - {name: alone, label: 단건, display: pill, color: check}
      - {name: together, label: 묶음, display: pill, color: check}
      - {name: status, source: order_requests_v.status, display: pill, color: status}
      - {name: created_by, source: order_requests.created_by, sub: approved_by}
      - {name: trade_date, source: order_requests.trade_date, format: date, hidden: true}
      - {name: approved_by, source: order_requests_v.approved_by}
      - {name: last_reason, source: order_requests_v.last_reason, hidden: true}
    actions:
      - id: approve
        label: 승인
        tx: STP5100U01
        lock: approve_lock
        note: 체크한 요청을 승인해요. 서버가 권한(1건 한도, 셀프 승인)과 묶음 검증을 한 번 더 봐요. 장중이면 run이 보내기 직전에 다시 검증하고 보내요.
      - id: reject
        label: 반려
        tx: STP5100U02
        lock: reject_lock
        note: 체크한 요청을 사유와 함께 돌려보내요. 작성자는 고쳐서 새로 요청해요.
        fields:
          - {name: reason, source: order_approvals.reason}
      - id: cancel
        label: 요청 취소
        tx: STP5100U03
        lock: cancel_lock
        note: 작성자가 전송 전에 요청을 거둬요. 이미 나간 주문은 주문 취소(cancel)로 해요.
        fields:
          - {name: reason, source: order_approvals.reason}
  - id: set
    title: 선택 묶음 검증
    tx: STP5100R02
    load: input
    key: item
    weight: 2
    meta: {picked: 체크, verdict: 판단}
    columns:
      - {name: item, label: 항목}
      - {name: result, label: 결과, display: pill, color: verdict}
      - {name: value, label: 체크한 요청 + 이미 승인한 주문, sub: detail}
      - {name: detail, label: 기준}
  - id: history
    title: 결재·전송 이력
    tx: STP5100R03
    load: master
    master: requests
    link: {request_id: request_id}
    weight: 2
    columns:
      - {name: id, source: order_approvals.id, format: number, hidden: true}
      - {name: at, source: order_approvals.at, format: datetime}
      - {name: action, source: order_approvals.action, format: code}
      - {name: actor, source: order_approvals.actor}
      - {name: self_approved, source: order_approvals.self_approved}
      - {name: client_id, source: order_approvals.client_id, format: code}
      - {name: reason, source: order_approvals.reason}
