id: STP-3300
title: 시산표
purpose: 합계잔액시산표 모양으로, 가운데 계정과목을 두고 왼쪽에 차변(당일잔액·당일증감·전일잔액), 오른쪽에 대변(전일잔액·당일증감·당일잔액)을 적어요. 자산·비용은 차변에, 부채·자본·수익은 대변에 잔액이 서고, 계정 분류마다 합계 줄이 먼저 와요. 맨 아래 총합계의 차변과 대변이 같아야 하고, 그 결과를 표 위에 함께 보여줘요. 어느 이벤트가 그 잔액을 만들었는지는 분개 조회(STP-3200)에서 따라가요.
