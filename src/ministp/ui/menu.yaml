# 화면 분류 (왼쪽 메뉴트리, 화면정의서의 분류표).
#
# 화면번호 STP-ABCD 가 곧 분류예요.
#   A  대분류: 거래가 흘러가는 순서. 1 주문·잔고 → 2 대사·평가 → 3 원장·회계, 4는 셋이 함께 쓰는 기준정보,
#      6은 거기서 나온 성과 (5는 운용 규칙·통제 자리로 비워 둬요)
#      기준정보에는 어느 계좌를 보든 같은 값만 둬요. 보유, 잔액, 계좌 현황처럼 계좌에 딸린 것은 1~3에 있어요.
#   B  중분류: 그 단계에서 다루는 대상 (AB 두 자리로 적어요)
#   C  소분류: 같은 대상을 다루는 화면의 순번
#   D  0이면 대표 화면, 1~9면 대표 화면(ABC0)에서 들어가는 딸린 화면. 딸린 화면은 메뉴트리에 따로 나오지 않고,
#      대표 화면이 그 화면으로 가는 이동(drill)을 가져야 해요 (예: 4100 종목정보 → 4101 마스터 적재 이력)
#
# 메뉴에는 여기 적은 순서대로 나와요(번호 순서가 아니라 업무 순서). 중분류 안에서는 번호 순서이고,
# first: [화면번호, …]를 적으면 그 화면들이 먼저 나와요.
# 새 화면은 여기 있는 분류에 들어가야 서버가 떠요. 화면이 하나도 없는 분류도 오류예요(예정인 분류는 적지 않아요).
# 조회와 처리는 번호가 아니라 트랜잭션 ID로 갈라요(R 조회, U 처리).
- id: 1
  name: 주문·잔고
  note: 주문에서 체결까지, 그리고 지금 들고 있는 것 (IBOR)
  groups:
    - {id: 11, name: 잔고}
    - {id: 13, name: 주문 준비}   # 주문 전에 보는 것: 주문가능, 바스켓 시뮬레이션. 메뉴에서는 주문·체결보다 먼저
    - {id: 12, name: 주문·체결}
    - {id: 14, name: 고객별 보유}
- id: 2
  name: 대사·평가
  note: 증권사와 맞는지, 하루의 값이 얼마인지
  groups:
    - {id: 21, name: 대사}
    - {id: 22, name: 순자산}
    - {id: 23, name: 시세}
    - {id: 24, name: 마감 점검}
- id: 3
  name: 원장·회계
  note: 기록된 이벤트와 그 분개, 거기서 나온 계좌 현황 (ABOR)
  groups:
    - {id: 31, name: 원장}
    - {id: 32, name: 분개}
    - {id: 33, name: 시산표}
    - {id: 34, name: 계좌 현황}
- id: 4
  name: 기준정보
  note: 위 세 단계가 함께 쓰는 종목, 거래 기준, 분개 모형, 계좌 등록 정보, 공통코드 (보유와 잔액은 1~3에 있어요)
  groups:
    - {id: 41, name: 종목}
    - {id: 43, name: 거래 기준}
    - {id: 44, name: 계좌 관리}
    - {id: 45, name: 회계 기준}
    - {id: 46, name: 공통코드}
- id: 6
  name: 성과
  note: 원장과 순자산에서 나온 결과. 입출금은 수익률에 섞이지 않아요
  groups:
    - {id: 61, name: 수익률}
