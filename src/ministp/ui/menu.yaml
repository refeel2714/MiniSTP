# 화면 분류 (왼쪽 메뉴트리, 화면정의서의 분류표).
#
# 화면번호 STP-ABCC 가 곧 분류예요.
#   A  대분류: 거래가 흘러가는 순서. 1 주문·잔고 → 2 대사·평가 → 3 원장·회계, 4는 셋이 함께 쓰는 기준정보
#      기준정보에는 어느 계좌를 보든 같은 값만 둬요. 보유, 잔액, 계좌 현황처럼 계좌에 딸린 것은 1~3에 있어요.
#   B  중분류: 그 단계에서 다루는 대상 (AB 두 자리로 적어요)
#   CC 소분류: 같은 대상을 다루는 화면의 순번 (지금은 모두 00)
#
# 새 화면은 여기 있는 분류에 들어가야 서버가 떠요. 화면이 하나도 없는 분류도 오류예요(예정인 분류는 적지 않아요).
# 조회와 처리는 번호가 아니라 트랜잭션 ID로 갈라요(R 조회, U 처리).
- id: 1
  name: 주문·잔고
  note: 주문에서 체결까지, 그리고 지금 들고 있는 것 (IBOR)
  groups:
    - {id: 11, name: 잔고}
    - {id: 12, name: 주문·체결}
    - {id: 13, name: 주문가능}
    - {id: 14, name: 고객별 보유}
- id: 2
  name: 대사·평가
  note: 증권사와 맞는지, 하루의 값이 얼마인지
  groups:
    - {id: 21, name: 대사}
    - {id: 22, name: 기준가}
    - {id: 23, name: 시세}
    - {id: 24, name: 마감 점검}
- id: 3
  name: 원장·회계
  note: 기록된 이벤트와 그 분개, 거기서 나온 계좌 현황 (ABOR)
  groups:
    - {id: 31, name: 원장}
    - {id: 32, name: 분개}
    - {id: 33, name: 시산표}
    - {id: 34, name: 계좌 현황}
- id: 4
  name: 기준정보
  note: 위 세 단계가 함께 쓰는, 계좌와 무관한 종목과 거래 기준
  groups:
    - {id: 41, name: 종목}
    - {id: 43, name: 거래 기준}
    - {id: 44, name: 계좌 관리}
